# Production canonical-domain Nginx configuration.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/quiz/web/dist;
    index index.html;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name acemock.cn www.acemock.cn;

    return 301 https://acemock.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.acemock.cn;

    ssl_certificate /etc/nginx/ssl/acemock.cn/acemock.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/acemock.cn/acemock.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://acemock.cn$request_uri;
}

