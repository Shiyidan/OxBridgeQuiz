<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AceMock 云舟备考｜ESAT 与 TMUA 真题诊断</title>
    <meta
      name="description"
      content="AceMock 云舟备考基于历年真题和考试大纲，提供 ESAT、TMUA 水平诊断、知识点分析、专项练习与错题复习，帮助学生针对薄弱项高效备考。"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://acemock.cn/" />
    <link rel="icon" type="image/png" href="/src/assets/brand/acemock-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="AceMock 云舟备考" />
    <meta property="og:title" content="AceMock 云舟备考｜ESAT 与 TMUA 真题诊断" />
    <meta
      property="og:description"
      content="基于历年真题和考试大纲，提供 ESAT、TMUA 水平诊断、知识点分析、专项练习与错题复习。"
    />
    <meta property="og:url" content="https://acemock.cn/" />

    <script id="website-structured-data" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AceMock 云舟备考",
        "alternateName": ["AceMock", "云舟备考", "acemock.cn"],
        "url": "https://acemock.cn/"
      }
    </script>
    <script>
      ;(() => {
        const publicPaths = new Set([
          '/',
          '/en',
          '/exam-intro/esat',
          '/exam-intro/tmua',
          '/exam-intro/step',
        ])
        const path =
          window.location.pathname !== '/'
            ? window.location.pathname.replace(/\/$/, '')
            : window.location.pathname
        if (path === '/en') {
          document.documentElement.lang = 'en'
          const title = 'AceMock | ESAT & TMUA Diagnostics and Practice'
          const description =
            'Prepare for ESAT and TMUA with past-paper diagnostics, topic-based learning, targeted practice and timed mock exams.'
          document.title = title
          document.querySelector('meta[name="description"]')?.setAttribute('content', description)
          document
            .querySelector('link[rel="canonical"]')
            ?.setAttribute('href', 'https://acemock.cn/en/')
          for (const [key, value] of Object.entries({
            title,
            description,
            locale: 'en_GB',
            site_name: 'AceMock',
            url: 'https://acemock.cn/en/',
          })) {
            document.querySelector(`meta[property="og:${key}"]`)?.setAttribute('content', value)
          }
          const websiteData = document.getElementById('website-structured-data')
          if (websiteData)
            websiteData.textContent = JSON.stringify({
              '@context': 'https://schema.org',
              '@type': 'WebSite',
              name: 'AceMock',
              url: 'https://acemock.cn/',
              inLanguage: ['zh-CN', 'en'],
            })
        }
        if (publicPaths.has(path)) return

        document.title = 'AceMock 云舟备考'
        document
          .querySelector('meta[name="robots"]')
          ?.setAttribute('content', 'noindex, nofollow, noarchive, nosnippet')
        document.querySelector('meta[name="description"]')?.remove()
        document.querySelector('link[rel="canonical"]')?.remove()
        document.querySelectorAll('meta[property^="og:"]').forEach((element) => element.remove())
        document.getElementById('website-structured-data')?.remove()
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
